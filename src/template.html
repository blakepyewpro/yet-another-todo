<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yet Another Todo...</title>
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
</head>
<body>
<header>
  <button id="menu"><img src="./assets/menu.svg" alt="menu button"></button>
  <span id="title"><span id="yet">Yet</span> <span id="another">Another</span> <span id="todo">Todo...</span></span>
  <button id="create"><img src="./assets/plus.svg" alt="plus">Create</button>
</header>
<div id="display">
  <div id="menu-area">
    <ul id="filters">
      <li id="all"><span>All Tasks</span></li>
      <li id="today"><span>Today</span></li>
      <li id="week"><span>This Week</span></li>
    </ul>
    <ul id="projects"></ul>
  </div>
  <div id="list-area">
    <div class="project">
      <div class="project-header">
        <div class="project-left">
          <span class="project-title">Project Name</span>
          <button class="project-edit"><img src="assets/file-edit-outline.svg" alt="edit project"></button>
          <button class="project-delete"><img src="assets/delete-outline.svg" alt="delete project"></button>
        </div>
        <div class="project-right">
          <div class="task-counter-area">
            <span class="task-counter">X</span><span> TASKS</span>
          </div>
          <div class="complete-counter-area">
            <span class="complete-counter">X</span><span> COMPLETE</span>
          </div>
        </div>
      </div>
      <div class="task-list"></div>
    </div>
  </div>
</div>
<dialog closedby="none">
  <div id="dialog-content">
    <span id="dialog-title">Create...</span>
    <div id="form-toggles">
      <button id="task-btn" class="form-toggle selected">Task</button>
      <button id="proj-btn" class="form-toggle">Project</button>
    </div>
    <form></form>
  </div>
</dialog>
</body>
</html>
