<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yet Another Todo...</title>
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
</head>
<body>
<header>
  <button id="menu"><img src="./assets/menu.svg" alt="menu button"></button>
  <span id="title"><span id="yet">Yet</span> <span id="another">Another</span> <span id="todo">Todo...</span></span>
  <button id="create"><img src="./assets/plus.svg" alt="plus">Create</button>
</header>
<div id="display">
  <div id="menu-area">
    <ul id="filters">
      <li id="all"><span>All Tasks</span></li>
      <li id="today"><span>Today</span></li>
      <li id="week"><span>This Week</span></li>
    </ul>
    <ul id="projects"></ul>
  </div>
  <div id="list-area">
    <div class="task complete" data-id="uuid">
      <div class="task-content">
        <div class="task-header">
          <div class="task-left">
            <input type="checkbox">
            <span class="task-title">Task 1</span>
          </div>
          <div class="task-center">
            <span class="task-prio med">Medium</span>
          </div>
          <div class="task-right">
            <div class="due-date">
              <span class="date-label">DUE BY</span>
              <span class="date due">22/05/2026</span>
            </div>
          </div>
        </div>
        <div class="task-notes">
          <span class="notes-label">NOTES</span>
          <span class="notes">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Praesent et venenatis est.
          </span>
        </div>
      </div>
      <div class="task-buttons">
        <button class="task-edit"><img src="assets/file-edit-outline.svg" alt="edit task"></button>
        <button class="task-delete"><img src="assets/delete-outline.svg" alt="delete task"></button>
      </div>
    </div>
  </div>
</div>
<dialog closedby="none" id="creation">
  <div id="dialog-content">
    <span id="dialog-title">Create...</span>
    <div id="form-toggles">
      <button id="task-btn" class="form-toggle selected">Task</button>
      <button id="proj-btn" class="form-toggle">Project</button>
    </div>
    <form id="create-form"></form>
  </div>
</dialog>
</body>
</html>
